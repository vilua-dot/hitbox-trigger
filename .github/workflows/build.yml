name: Build Agent JAR

on:
  push:
    branches: [ "claude/busy-fermi-913pdn" ] # Запускать при пуше в эту ветку
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21 # Указываем версию Java (для Minecraft 1.21.1 обычно нужна 21)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build with Gradle
      run: gradle build

    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: agent-jar
        path: '**/build/libs/*.jar'
