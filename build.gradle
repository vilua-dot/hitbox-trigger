allprojects {
    repositories {
        // Сначала ищем зависимости в зеркале Aliyun
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        
        // Официальные репозитории оставляем как резервные
        mavenCentral()
        gradlePluginPortal()
    }
}
